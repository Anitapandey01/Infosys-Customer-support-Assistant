services:

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: servex-ai-backend
    ports:
      - "3009:3009"
    env_file:
      - ./backend/.env
    volumes:
      - backend_data:/app/data
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:3009
    container_name: servex-ai-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  backend_data: